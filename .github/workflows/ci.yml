name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Real for the DB-backed steps (a local MongoDB replica set started
  # below), dummy for everything else -- unit tests mock Prisma
  # entirely and don't need it, but `prisma generate`/`next build` just
  # need *some* value set to run at all (Prisma only reads the schema
  # locally at generate time, it doesn't connect).
  DATABASE_URL: "mongodb://127.0.0.1:27017/ci?replicaSet=rs0"
  NEXTAUTH_SECRET: "ci-dummy-secret"
  NEXTAUTH_JWT_SECRET: "ci-dummy-jwt-secret"
  GITHUB_ID: "ci-dummy"
  GITHUB_SECRET: "ci-dummy"
  GOOGLE_CLIENT_ID: "ci-dummy"
  GOOGLE_CLIENT_SECRET: "ci-dummy"
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "ci-dummy"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee /tmp/coverage-output.txt
          {
            echo "### Coverage (\`app/api\` + \`app/libs\`)"
            echo '```'
            sed -n '/Coverage report/,/^=\+$/p' /tmp/coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Build
        run: npm run build

      # Prisma's MongoDB connector needs a replica set (even a single-
      # node one) to support transactions -- GitHub Actions' `services:`
      # key can't override a service container's startup command, so
      # this starts mongod directly with `docker run` instead and
      # initiates the replica set once it's reachable.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            sleep 1
          done
          # rs.initiate() with no args advertises the container's own
          # hostname as the member address (e.g. 69dd47fa6655:27017),
          # which the schema-push/seed steps below -- running on the
          # runner itself, not inside the container -- can't resolve.
          # Pin the member host to 127.0.0.1 explicitly instead.
          docker exec mongo mongosh --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.status().myState" | grep -q '^1$' && break
            sleep 1
          done

      - name: Sync database schema
        run: npx prisma db push

      - name: Seed E2E test data
        run: node e2e/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
